<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .glow-orb {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      .wave-path {
        animation: waveFlow 12s linear infinite;
      }
      .eq-bar {
        animation: eqBounce 1.4s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      @keyframes floatOrb {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.1); }
        100% { transform: translate(-25px, 20px) scale(0.95); }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 800; }
      }
      @keyframes eqBounce {
        0% { transform: scaleY(0.3); }
        50% { transform: scaleY(0.95); }
        100% { transform: scaleY(0.45); }
      }
    </style>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- 2. Ambient Dynamic Glow Orbs (Background layer) -->
  <circle cx="180" cy="100" r="140" fill="url(#glowGrad1)" class="glow-orb" />
  <circle cx="1020" cy="300" r="160" fill="url(#glowGrad2)" class="glow-orb" style="animation-delay: -3s;" />
  <circle cx="600" cy="50" r="120" fill="url(#glowGrad1)" class="glow-orb" style="animation-delay: -5s;" />

  <!-- 3. Animated Digital Audio Waveforms (Background / Midground) -->
  <path d="M -50 290 Q 150 200, 350 290 T 750 290 T 1150 290 T 1350 290" 
        fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.35" 
        stroke-dasharray="16 8" class="wave-path" />
        
  <path d="M -50 310 Q 150 380, 350 310 T 750 310 T 1150 310 T 1350 310" 
        fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.3" 
        stroke-dasharray="12 6" class="wave-path" style="animation-duration: 9s; animation-direction: reverse;" />

  <!-- 4. Dynamic Equalizer Bars in the Background (subtle accent) -->
  <g transform="translate(100, 360)" opacity="0.35">
    <rect class="eq-bar" x="0" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.1s; animation-duration: 1.1s;" />
    <rect class="eq-bar" x="14" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.3s; animation-duration: 1.5s;" />
    <rect class="eq-bar" x="28" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.5s; animation-duration: 1.2s;" />
    <rect class="eq-bar" x="42" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.2s; animation-duration: 1.7s;" />
    <rect class="eq-bar" x="56" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.4s; animation-duration: 1.3s;" />
    <rect class="eq-bar" x="70" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.6s; animation-duration: 1.6s;" />
    <rect class="eq-bar" x="84" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.25s; animation-duration: 1.4s;" />
  </g>
  <g transform="translate(1000, 360)" opacity="0.35">
    <rect class="eq-bar" x="0" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.4s; animation-duration: 1.3s;" />
    <rect class="eq-bar" x="14" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.15s; animation-duration: 1.6s;" />
    <rect class="eq-bar" x="28" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.55s; animation-duration: 1.1s;" />
    <rect class="eq-bar" x="42" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.3s; animation-duration: 1.4s;" />
    <rect class="eq-bar" x="56" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.6s; animation-duration: 1.7s;" />
    <rect class="eq-bar" x="70" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.2s; animation-duration: 1.2s;" />
    <rect class="eq-bar" x="84" y="-80" width="8" height="80" rx="4" fill="url(#eqGrad)" style="animation-delay: 0.5s; animation-duration: 1.5s;" />
  </g>

  <!-- 5. Foreground Content Container (Card Backing for guaranteed clarity) -->
  <rect x="140" y="45" width="920" height="310" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Badge Pill on Top of Foreground Card -->
  <g transform="translate(470, 75)">
    <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Title (Always in Crisp Foreground) -->
  <text x="600" y="170" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">Awesome Digital Media Management</text>

  <!-- Subtitle -->
  <text x="600" y="218" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500">Music Distribution • Self-Hosted Streaming • DDEX Catalog Tools • Creator Monetization</text>

  <!-- Feature Tags / Pills -->
  <g transform="translate(240, 260)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="80" y="24" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🎧 Audio Streaming</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(180, 0)">
      <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="90" y="24" text-anchor="middle" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🚀 DSP Distribution</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(380, 0)">
      <rect width="170" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="85" y="24" text-anchor="middle" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🌐 Self-Hosted Media</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(570, 0)">
      <rect width="150" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="75" y="24" text-anchor="middle" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">💰 Direct Sales</text>
    </g>
  </g>
</svg>
